name: 'Restore GCC from cache'

inputs:
  gcc-version:
    description: 'The GCC version to load (e.g., 16.1.0, 16.2.0)'
    required: false
    default: '16.1.0'

runs:
  using: "composite"
  steps:
    # 1. 尝试恢复缓存（使用版本号作为缓存键的一部分，防止不同版本冲突）
    - name: Cache GCC ${{ inputs.gcc-version }}
      id: cache-gcc
      uses: actions/cache@v4
      with:
        path: /usr/local/gcc-${{ inputs.gcc-version }}
        key: ${{ runner.os }}-${{ runner.arch }}-gcc-${{ inputs.gcc-version }}

    # 2. 仅在缓存未命中时执行编译
    - name: Build GCC ${{ inputs.gcc-version }} from source
      if: steps.cache-gcc.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Failed to reload gcc cache!"
        exit 1
